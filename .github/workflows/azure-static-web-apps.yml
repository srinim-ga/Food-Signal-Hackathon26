# Deploys the PWA + managed Functions API to Azure Static Web Apps.
#
# Hosted GitHub Actions runners are disabled for this org, so this workflow is
# manual-only and will not run automatically. Deploy from your machine with the
# SWA CLI + deployment token instead (see README / setup guide).
#
# TODO before enabling (only if self-hosted runners become available):
#   1. Create the Static Web App (see docs/Food-Signal-Azure-Setup-Guide.md).
#   2. Add the deployment token as a repo secret named AZURE_STATIC_WEB_APPS_API_TOKEN.
#   3. Confirm app_location / api_location / output_location match this repo.
name: Deploy to Azure Static Web Apps

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build shared package
        run: |
          npm ci
          npm run build:shared

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # TODO: Replace with the real deployment token secret.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "frontend"
          api_location: "api"
          output_location: "dist"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close PR environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
